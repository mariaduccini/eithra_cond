{% load static %}<!doctype html>
{# Documento base do Eithra. Estrutura, grid e comportamento vêm do Sneat. #}
<html
  lang="pt-br"
  class="layout-menu-fixed layout-compact"
  data-assets-path="{% static 'vendor/sneat/' %}"
  data-template="vertical-menu-template-free">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Eithra{% endblock %}</title>
    <meta name="description" content="Eithra — gestão condominial" />

    <link rel="icon" type="image/svg+xml" href="{% static 'img/eithra-mark.svg' %}" />

    <link rel="stylesheet" href="{% static 'vendor/boxicons/css/boxicons.min.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/sneat/css/core.css' %}" />
    <link rel="stylesheet" href="{% static 'vendor/sneat/css/perfect-scrollbar.css' %}" />
    <link rel="stylesheet" href="{% static 'css/eithra.css' %}" />
    {% block extra_css %}{% endblock %}

    <script src="{% static 'vendor/sneat/js/helpers.js' %}"></script>
  </head>

  <body>
    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
  </body>
</html>
